load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    http2_body_preread_size 65535;
    access_log off;
    types { }
    default_type "";
    server_tokens off;
    absolute_redirect off;
    more_clear_headers Server;
    js_import site from /srv/current/site.js;
    js_preload_object onekbRepresentations from /srv/current/representations.json;
    resolver 1.1.1.1 ipv6=off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384;
    ssl_conf_command NumTickets 1;
    ssl_session_cache shared:ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        state_path /acme;
        account_key ecdsa:256;
        profile tlsserver require;
        preferred_chain "ISRG Root X2";
        ssl_trusted_certificate /etc/ssl/cert.pem;
        accept_terms_of_service;
    }
    # These loopback-only hosts manage renewal. Public hosts load static
    # certificate files so OpenSSL can precompress the certificate messages.
    server {
        listen 127.0.0.1:9443 ssl;
        server_name tomkimberlin.com;
        acme_certificate letsencrypt key=ecdsa:256;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        location / { return 404; }
    }
    server {
        listen 127.0.0.1:9443 ssl;
        server_name www.tomkimberlin.com;
        acme_certificate letsencrypt key=ecdsa:256;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        location / { return 404; }
    }
    server {
        listen 127.0.0.1:9443 ssl;
        server_name tom.kimberlin.net;
        acme_certificate letsencrypt key=ecdsa:256;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        location / { return 404; }
    }
    server {
        listen 80;
        server_name tomkimberlin.com www.tomkimberlin.com tom.kimberlin.net;
        # The ACME module handles active HTTP-01 challenges before this handler.
        location / { js_content site.serve; js_header_filter site.headers; }
    }
    server {
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        server_name tomkimberlin.com;
        ssl_certificate /tls/current/tomkimberlin.com.crt;
        ssl_certificate_key /tls/current/tomkimberlin.com.key;
        ssl_certificate_compression on;
        ssl_certificate_compression_brotli_cache /tls/compressed;
        location / { js_content site.serve; js_header_filter site.headers; }
    }
    server {
        listen 443 ssl;
        listen 443 quic;
        http2 on;
        server_name www.tomkimberlin.com;
        ssl_certificate /tls/current/www.tomkimberlin.com.crt;
        ssl_certificate_key /tls/current/www.tomkimberlin.com.key;
        ssl_certificate_compression on;
        ssl_certificate_compression_brotli_cache /tls/compressed;
        location / { js_content site.serve; js_header_filter site.headers; }
    }
    server {
        listen 443 ssl;
        listen 443 quic;
        http2 on;
        server_name tom.kimberlin.net;
        ssl_certificate /tls/current/tom.kimberlin.net.crt;
        ssl_certificate_key /tls/current/tom.kimberlin.net.key;
        ssl_certificate_compression on;
        ssl_certificate_compression_brotli_cache /tls/compressed;
        location / { js_content site.serve; js_header_filter site.headers; }
    }
}
