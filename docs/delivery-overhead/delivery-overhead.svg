<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img" aria-labelledby="title description"><title id="title">Cold-connection TLS overhead</title><desc id="description">Archived Cloudflare test: 6,203 bytes. Matched nginx tests using the same certificate chain: stock 5,421 bytes and optimized 4,432 bytes. TLS bytes through the first complete HTTP/2 page response minus the entire encoded body; excludes TCP/IP, DNS and connection close. Cloudflare is a separate, unmatched historical control.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1080" height="880" fill="white"/>
