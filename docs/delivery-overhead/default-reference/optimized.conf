load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
    http2_body_preread_size 65535;
    access_log off;
    types { }
    default_type "";
    server_tokens off;
    absolute_redirect off;
    more_clear_headers Server;
    js_import site from /fixture/public/site.js;
    js_preload_object onekbRepresentations from /fixture/public/representations.json;
    resolver 1.1.1.1 ipv6=off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384;
    ssl_conf_command NumTickets 1;
    ssl_session_cache shared:ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

 server {
  listen 127.0.0.1:8443 ssl;
  http2 on;
  server_name tomkimberlin.com;
  ssl_certificate /fixture/chain.pem;
  ssl_certificate_key /fixture/key.pem;
  ssl_certificate_compression on;
  ssl_certificate_compression_brotli_cache /fixture/empty-cache;
  location / { js_content site.serve; js_header_filter site.headers; }
 }
}
