# Fragments for an isolated server running the real site handler at /.
# Mount tools/fixtures at /response-tests. Add the import to http{} and the
# location to the TLS test server{}. Enable a QUIC listener when testing H3.

# http{}:
js_import encoding from /response-tests/header-encoding.js;

# TLS server{}:
location /_encoding/ {
    js_content encoding.serve;
    js_header_filter encoding.headers;
}
