# Configuration fragments for an isolated response-buffering test server.
# Mount tools/fixtures at /response-tests. Place the import in http{}, then the
# locations in the TLS server{} being tested. This is not a complete nginx.conf
# and cannot be included wholesale at one configuration level.

# http{}:
js_import coalescing from /response-tests/response-buffering.js;

# TLS server{}:
# Keep this streaming location free of a JavaScript header filter: reentering
# njs through sendHeader can leave its filter guard active for later send calls.
location = /_coalesce/stream {
    js_content coalescing.serve;
}
# Exercise write-filter NGX_AGAIN and timer-based resumption with a 318-byte body.
location = /_coalesce/slow {
    limit_rate 128;
    js_content coalescing.serve;
    js_header_filter coalescing.headers;
}
location = /_coalesce/no-body {
    js_content coalescing.serve;
    js_header_filter coalescing.headers;
    js_body_filter coalescing.noBody;
}
location /_coalesce/ {
    js_content coalescing.serve;
    js_header_filter coalescing.headers;
}
